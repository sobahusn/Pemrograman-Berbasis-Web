<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Car Management App | PBL0902</title>
  <link rel="stylesheet" href="/static/css/bootstrap-pbl0602.min.css" />
</head>

<body>
  <header class="container-fluid p-4 text-center bg-light shadow-sm">
    {% include 'components/header.html' %}
  </header>

  <main class="container-fluid px-4">
    <nav class="mt-4 d-flex flex-wrap align-items-center gap-2" aria-label="Pilih microservice">
      <span class="text-muted me-1">Service ({{ db_name }}):</span>
      {% for service in services %}
      <a class="btn btn-sm {% if service == active_ms %}btn-primary{% else %}btn-outline-primary{% endif %}"
        href="/?ms={{ service }}" {% if service == active_ms %}aria-current="page"{% endif %}>
        {{ service }}
      </a>
      {% endfor %}
    </nav>

    <section class="d-flex flex-column flex-md-row align-items-center justify-content-between mt-3 gap-3">
      {% include 'components/add_modal.html' %}
      {% include 'components/search_form.html' %}
    </section>

    <section class="card shadow-sm border-0 mt-4" aria-label="Car data list">
      {% include 'components/table_list.html' %}
    </section>
  </main>

  <footer class="text-center py-3 mt-4">
    {% include 'components/footer.html' %}
  </footer>

  <script src="/static/js/bootstrap-pbl0602.bundle.min.js"></script>
</body>

</html>
