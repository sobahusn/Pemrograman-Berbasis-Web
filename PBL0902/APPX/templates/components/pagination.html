<section class="card-footer d-flex justify-content-center mt-3">
  <nav aria-label="Page navigation">
    <ul class="pagination mb-0">
      <li class="page-item {% if page <= 1 %}disabled{% endif %}">
        <a class="page-link" href="{{ previous_url }}" aria-label="Previous">Prev</a>
      </li>
      {% for number, url in page_urls %}
      <li class="page-item {% if number == page %}active{% endif %}">
        <a class="page-link" href="{{ url }}" {% if number == page %}aria-current="page"{% endif %}>{{ number }}</a>
      </li>
      {% endfor %}
      <li class="page-item {% if page >= total_pages %}disabled{% endif %}">
        <a class="page-link" href="{{ next_url }}" aria-label="Next">Next</a>
      </li>
    </ul>
  </nav>
</section>
