<section class="card-footer d-flex justify-content-center mt-3">

    <nav aria-label="Page navigation">
        <ul class="pagination">
            <!-- Previous Button -->
            <li class="page-item {% if page <= 1 %}disabled{% endif %}">
                <a class="page-link" href="?page={{ page - 1 }}{% if query %}&query={{ query }}{% endif %}"
                    aria-label="Previous">
                    Prev
                </a>
            </li>

            <!-- Page Numbers -->
            {% for p in range(1, total_pages + 1) %}
            <li class="page-item {% if p == page %}active{% endif %}">
                <a class="page-link" href="?page={{ p }}{% if query %}&query={{ query }}{% endif %}">{{ p }}</a>
            </li>
            {% endfor %}

            <!-- Next Button -->
            <li class="page-item {% if page >= total_pages %}disabled{% endif %}">
                <a class="page-link" href="?page={{ page + 1 }}{% if query %}&query={{ query }}{% endif %}"
                    aria-label="Next">
                    Next
                </a>
            </li>
        </ul>
    </nav>
</section>
